name: Release desktop

# Desktop (Wails) release line. Tag namespace `desktop-v<semver>` triggers this —
# plain `v<semver>` tags are the CLI release (release.yml) and intentionally do NOT
# trigger here (GitHub glob `v*` does not match `desktop-v*`). Bump with:
#   git tag desktop-vX.Y.Z && git push origin desktop-vX.Y.Z
#
# Wails cannot cross-compile a CGO/WebKit binary, so build/ fans out to one native
# runner per platform. Artifacts are minisign-signed (MINISIGN_* secrets), a
# latest.json manifest is generated, and everything is published to a GitHub
# release and mirrored to R2 (the updater reads R2 first, GitHub as fallback).
#
# The same build/sign/manifest pipeline serves two channels. A `desktop-v*` tag
# (or manual stable dispatch) publishes a GitHub release and moves R2's latest/
# pointer. A manual `channel: canary` dispatch builds with -X main.channel=canary
# and uploads only to R2's canary/ pointer — no GitHub release, so canary never
# shows on the releases page and never touches latest/.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [stable, canary]
        default: stable
      tag:
        description: "stable: tag to publish (e.g. desktop-v1.1.0)"
        required: false
        type: string
      base_version:
        description: "canary: intended next stable version, e.g. 1.5.0"
        required: false
        type: string
      allow_unsigned_windows:
        description: "TEMPORARY: allow an explicitly marked unsigned Windows release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # create the release and upload artifacts
  actions: read   # SignPath verifies the GitHub-hosted build provenance

jobs:
  cache-guard:
    name: cache hit guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache hit guard
        run: ./scripts/cache-guard.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"

      - name: Test core
        run: go test ./... -count=1 -p=1

      - name: Generate frontend bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          cd desktop
          wails generate module -tags webkit2_41

      - name: Test frontend
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run test:all
          npm run build

  build:
    name: build (${{ matrix.name }})
    needs: cache-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build (Intel + Apple Silicon) on a single arm64
          # runner — avoids the scarce/slow macos-13 Intel runner.
          - { runner: macos-14, platform: darwin/universal, name: darwin-universal }
          - { runner: windows-latest, platform: windows/amd64, name: windows-amd64 }
          - { runner: ubuntu-22.04, platform: linux/amd64, name: linux-amd64 }
    runs-on: ${{ matrix.runner }}
    env:
      HAS_MINISIGN: ${{ secrets.MINISIGN_PRIVATE_KEY != '' && secrets.MINISIGN_PASSWORD != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
      ALLOW_UNSIGNED_WINDOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_windows }}
    defaults:
      run:
        shell: bash # desktop-build.sh is bash; windows runners default to pwsh otherwise
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Linux: WebKitGTK 4.1 toolchain (-tags webkit2_41 in desktop-build.sh).
      # 4.1 ships from ubuntu-22.04 on and is the only one present on 24.04+/Fedora 40+.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      # Linux: nfpm builds the .deb in desktop-build.sh's linux branch. go install
      # drops it in ~/go/bin, already on PATH (same place the wails CLI lands below).
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # Windows: NSIS provides makensis for `wails build -nsis`.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      # macOS: create-dmg packages the .app into a drag-to-Applications .dmg.
      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # macOS signing: import the Developer ID cert into a throwaway keychain and
      # stage the notarization key. No-ops (and the build ad-hoc signs) when the
      # APPLE_* secrets aren't set, so forks still build.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "APPLE_CERT_P12 unset — desktop build will ad-hoc sign (un-notarized)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # Prepend the signing keychain to the search list so codesign / find-identity see it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Resolve version
        id: ver
        run: bash scripts/resolve-desktop-release.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_TAG: ${{ inputs.tag }}
          IN_BASE_VERSION: ${{ inputs.base_version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Require SignPath release signing
        if: runner.os == 'Windows'
        run: |
          if [ "$HAS_SIGNPATH" = "true" ]; then
            exit 0
          fi
          if [ "$ALLOW_UNSIGNED_WINDOWS" = "true" ]; then
            echo "::warning::Publishing an explicitly authorized temporary unsigned Windows release"
            exit 0
          fi
          echo "::error::SignPath configuration is required; unsigned Windows releases need an explicit manual override"
          exit 1

      - name: Build and package
        env:
          # macOS Developer ID + notarization path turns on only when all five
          # APPLE_* secrets are present; otherwise desktop-build.sh ad-hoc signs.
          # Harmless on Windows/Linux runners (only the darwin branch reads these).
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/desktop-build.sh "${{ matrix.platform }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.channel }}"

      - name: Test native desktop
        working-directory: desktop
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            go test -tags webkit2_41 ./... -count=1 -p=1
          else
            go test ./... -count=1 -p=1
          fi

      - name: Upload unsigned Windows app for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: upload-windows-app
        uses: actions/upload-artifact@v7
        with:
          name: signpath-windows-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop/build/bin/Orca.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows app with SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-executable
          github-artifact-id: ${{ steps.upload-windows-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signed-windows-app

      - name: Repackage Windows installer with signed app
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        run: |
          signed_app="$(find "${{ runner.temp }}/signed-windows-app" -type f -iname 'Orca.exe' | head -n1)"
          [ -n "$signed_app" ] || { echo "signed Windows app was not returned by SignPath" >&2; exit 1; }
          cp "$signed_app" desktop/build/bin/Orca.exe

          rm -f desktop/build/bin/O.R.C.A-for-Windows-*-installer.exe
          app_windows="$(cygpath -w "$PWD/desktop/build/bin/Orca.exe")"
          (cd desktop/build/windows/installer && makensis "-DARG_WAILS_AMD64_BINARY=$app_windows" project.nsi)

          installer="$(find desktop/build/bin -maxdepth 1 -type f \( -iname '*setup*.exe' -o -iname '*installer*.exe' \) | head -n1)"
          [ -n "$installer" ] || { echo "NSIS did not produce an installer" >&2; exit 1; }
          rm -f dist/O.R.C.A-for-Windows-windows-amd64-installer.exe dist/O.R.C.A-for-Windows-windows-amd64.zip
          cp "$installer" dist/O.R.C.A-for-Windows-windows-amd64-installer.exe

          staging_root="$(cd "${TMPDIR:-/tmp}" && pwd -P)"
          staging="$(mktemp -d "${staging_root}/orca-signed.XXXXXX")"
          cp desktop/build/bin/Orca.exe "$staging/Orca.exe"
          payload="desktop/build/windows/installer-go/payload"
          [ -f "$payload/node.exe" ] || { echo "signed Windows portable payload is missing node.exe" >&2; exit 1; }
          [ -f "$payload/LICENSE.node.txt" ] || { echo "signed Windows portable payload is missing Node LICENSE" >&2; exit 1; }
          [ -f "$payload/codegraph/bin/codegraph.cmd" ] || { echo "signed Windows portable payload is missing CodeGraph launcher" >&2; exit 1; }
          cp "$payload/node.exe" "$staging/node.exe"
          cp "$payload/LICENSE.node.txt" "$staging/LICENSE.node.txt"
          cp -R "$payload/codegraph" "$staging/codegraph"
          staging_win="$(cygpath -w "$staging")"
          zip_win="$(cygpath -w "$PWD/dist/O.R.C.A-for-Windows-windows-amd64.zip")"
          powershell.exe -NoProfile -NonInteractive -Command "\$ErrorActionPreference = 'Stop'; Compress-Archive -Force -Path '${staging_win}\\*' -DestinationPath '$zip_win'"
          staging="$(cd "$staging" && pwd -P)"
          case "$staging" in "$staging_root"/orca-signed.*) ;; *) echo "invalid staging cleanup path" >&2; exit 1 ;; esac
          rm -rf -- "$staging"

      - name: Upload unsigned Windows installer for SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: upload-windows-installer
        uses: actions/upload-artifact@v7
        with:
          name: signpath-windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/O.R.C.A-for-Windows-windows-amd64-installer.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer with SignPath
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-executable
          github-artifact-id: ${{ steps.upload-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/signed-windows-installer

      - name: Verify signed Windows release artifacts
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path '${{ runner.temp }}/signed-windows-installer' -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $signedInstaller) { throw 'signed Windows installer was not returned by SignPath' }
          Copy-Item -Force $signedInstaller.FullName 'dist/O.R.C.A-for-Windows-windows-amd64-installer.exe'
          # V2 updater compatibility aliases; remove in a later major release.
          Copy-Item -Force 'dist/O.R.C.A-for-Windows-windows-amd64-installer.exe' 'dist/DeepSeek-Orca-windows-amd64-installer.exe'
          Copy-Item -Force 'dist/O.R.C.A-for-Windows-windows-amd64.zip' 'dist/DeepSeek-Orca-windows-amd64.zip'

          $artifacts = @(
            'desktop/build/bin/Orca.exe',
            'dist/O.R.C.A-for-Windows-windows-amd64-installer.exe'
          )
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne 'Valid') {
              throw "$artifact has invalid Authenticode status: $($signature.Status) $($signature.StatusMessage)"
            }
            if (-not $signature.SignerCertificate) { throw "$artifact has no signer certificate" }
            if (-not $signature.TimeStamperCertificate) { throw "$artifact has no trusted timestamp" }
            Write-Host "$artifact signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Mark temporary unsigned Windows artifacts
        if: runner.os == 'Windows' && env.HAS_SIGNPATH != 'true' && env.ALLOW_UNSIGNED_WINDOWS == 'true'
        run: echo "::warning::Windows artifacts are unsigned and must be replaced after SignPath enrollment"

      - name: Verify Windows package integrity
        if: runner.os == 'Windows'
        run: |
          seven_zip="$(command -v 7z 2>/dev/null || command -v 7z.exe 2>/dev/null || true)"
          if [ -z "$seven_zip" ] && [ -x "/c/Program Files/7-Zip/7z.exe" ]; then
            seven_zip="/c/Program Files/7-Zip/7z.exe"
          fi
          [ -n "$seven_zip" ] || { echo "::error::7-Zip is required for release integrity checks"; exit 1; }
          "$seven_zip" t dist/O.R.C.A-for-Windows-windows-amd64-installer.exe
          "$seven_zip" t dist/O.R.C.A-for-Windows-windows-amd64.zip

      - name: Sign artifacts (minisign)
        if: env.HAS_MINISIGN == 'true'
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: go run ./cmd/sign sign ../dist/*

      - name: Skip signing notice
        if: env.HAS_MINISIGN != 'true'
        run: echo "MINISIGN secrets are not configured; publishing unsigned desktop artifacts without updater manifest."

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_MINISIGN: ${{ secrets.MINISIGN_PRIVATE_KEY != '' && secrets.MINISIGN_PASSWORD != '' }}
    # Stable publishes go through the `release` environment (maintainer approval);
    # canary uses the open `canary` environment so maintainers self-serve.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel == 'canary') && 'canary' || 'release' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: bash scripts/resolve-desktop-release.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_TAG: ${{ inputs.tag }}
          IN_BASE_VERSION: ${{ inputs.base_version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}

      # Generate latest.json with GitHub release download URLs; the mirror step
      # rewrites them to R2 afterwards. GITHUB_REPOSITORY is provided by the runner.
      - name: Generate manifest
        if: env.HAS_MINISIGN == 'true'
        working-directory: desktop
        run: go run ./cmd/sign manifest ../dist "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.tag }}"

      - name: Validate stable tag target
        if: steps.ver.outputs.channel != 'canary'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          refs="$(git ls-remote "$remote" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")" || {
            echo "::error::could not inspect remote tag ${TAG}" >&2
            exit 1
          }
          # Prefer the peeled commit for annotated tags; lightweight tags use
          # the direct ref. Empty output is the intentional create-at-target path.
          tag_sha="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1; exit }')"
          if [ -z "$tag_sha" ]; then
            tag_sha="$(printf '%s\n' "$refs" | awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1; exit }')"
          fi
          if [ -z "$tag_sha" ]; then
            echo "tag ${TAG} does not exist; final creation may target ${EXPECTED_SHA}"
            exit 0
          fi
          if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::tag ${TAG} points to ${tag_sha}, expected ${EXPECTED_SHA}; refusing release asset clobber" >&2
            exit 1
          fi
          echo "tag ${TAG} resolves to expected commit ${EXPECTED_SHA}"

      # Canary is R2-only and never appears on the GitHub releases page; the mirror
      # job picks up the signed dist via the canary-dist artifact below. Stable
      # publishes a GitHub release as usual.
      - name: Publish GitHub release
        if: steps.ver.outputs.channel != 'canary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "O.R.C.A. ${{ steps.ver.outputs.version }}" --target "${{ github.sha }}" --generate-notes)
          [ "${{ steps.ver.outputs.prerelease }}" = "true" ] && args+=(--prerelease)
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.ver.outputs.tag }} already exists; updating title and replacing assets."
            gh release edit "${{ steps.ver.outputs.tag }}" --title "O.R.C.A. ${{ steps.ver.outputs.version }}"
            gh release upload "${{ steps.ver.outputs.tag }}" dist/* --clobber
          else
            gh release create "${{ steps.ver.outputs.tag }}" dist/* "${args[@]}"
          fi

      - name: Upload canary dist for mirror
        if: steps.ver.outputs.channel == 'canary'
        uses: actions/upload-artifact@v7
        with:
          name: canary-dist
          path: dist/*
          if-no-files-found: error

  mirror:
    name: mirror to R2
    needs: publish
    runs-on: ubuntu-latest
    # Skip cleanly when R2 isn't configured; GitHub release still works as fallback.
    if: ${{ github.repository_owner == 'nanbo0ne' }}
    env:
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ACCOUNT_ID != '' && secrets.R2_BUCKET != '' }}
      HAS_MINISIGN: ${{ secrets.MINISIGN_PRIVATE_KEY != '' && secrets.MINISIGN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        run: bash scripts/resolve-desktop-release.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_TAG: ${{ inputs.tag }}
          IN_BASE_VERSION: ${{ inputs.base_version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}

      # Canary has no GitHub release — pull the signed dist from the workflow
      # artifact. Stable pulls from the published release.
      - name: Download canary dist
        if: env.HAS_R2 == 'true' && env.HAS_MINISIGN == 'true' && steps.ver.outputs.channel == 'canary'
        uses: actions/download-artifact@v8
        with:
          name: canary-dist
          path: assets

      - name: Download release assets
        if: env.HAS_R2 == 'true' && env.HAS_MINISIGN == 'true' && steps.ver.outputs.channel != 'canary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.ver.outputs.tag }}" -R "${{ github.repository }}" -D assets

      # Rewrite both url and sig inside latest.json from github.com to the R2 CDN,
      # so the updater pulls the manifest AND the heavy artifacts from R2.
      - name: Rewrite latest.json URLs to R2
        if: env.HAS_R2 == 'true' && env.HAS_MINISIGN == 'true'
        env:
          R2_PUBLIC_BASE: https://dl.orca-agent.io
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          f=assets/latest.json
          jq --arg base "$R2_PUBLIC_BASE" --arg tag "$TAG" '
            .platforms |= with_entries(
              .value.url |= sub("https://github.com/[^/]+/[^/]+/releases/download/[^/]+/"; "\($base)/\($tag)/")
              | .value.sig |= sub("https://github.com/[^/]+/[^/]+/releases/download/[^/]+/"; "\($base)/\($tag)/")
            )
          ' "$f" > "$f.new"
          mv "$f.new" "$f"
          cat "$f"

      - name: Configure AWS CLI for R2
        if: env.HAS_R2 == 'true' && env.HAS_MINISIGN == 'true'
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Mirror to R2
        if: env.HAS_R2 == 'true' && env.HAS_MINISIGN == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp assets/ "s3://${R2_BUCKET}/${TAG}/" --recursive --endpoint-url "$ENDPOINT"
          # The pointer a release moves is its channel's alone: canary writes
          # canary/, stable writes latest/. A stable prerelease (rc) moves neither.
          if [ "${{ steps.ver.outputs.channel }}" = "canary" ]; then
            aws s3 cp assets/ "s3://${R2_BUCKET}/canary/" --recursive --endpoint-url "$ENDPOINT"
          elif [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            echo "prerelease — leaving R2 latest/ untouched"
          else
            aws s3 cp assets/ "s3://${R2_BUCKET}/latest/" --recursive --endpoint-url "$ENDPOINT"
          fi

      - name: Skip R2 mirror without Minisign
        if: env.HAS_R2 == 'true' && env.HAS_MINISIGN != 'true'
        run: echo "::warning::Skipping all R2 mirror steps because Minisign is not configured; existing R2 latest/ is unchanged"
